   <g id="text_2">
    <text style="fill: #6d7884; font: 13px 'Arial Unicode MS'; text-anchor: start" x="29.52" y="45.2265" transform="rotate(-0 29.52 45.2265)">116 任务实验使用串行 runner；探索结束并恢复后才推理</text>
   </g>
   <g id="text_3">
    <text style="fill: #203046; font: 13px 'Arial Unicode MS'" transform="translate(161.724219 88.88702)">① 结算上一模型动作</text>
    <text style="fill: #203046; font: 13px 'Arial Unicode MS'" transform="translate(103.574609 108.607512)">前后状态检查，记录流程 hop 与提交边界</text>
   </g>
   <g id="text_4">
    <text style="fill: #203046; font: 13px 'Arial Unicode MS'" transform="translate(133.918438 167.317145)">② 读取当前 UI，登记屏幕节点</text>
    <text style="fill: #203046; font: 13px 'Arial Unicode MS'" transform="translate(85.53 185.866418)">读取探索开始前的图快照，解析上一步推理需求</text>
   </g>
   <g id="text_5">
    <text style="fill: #203046; font: 13px 'Arial Unicode MS'" transform="translate(130.306875 244.670098)">③ 流程图规划与实体 / 字段回放</text>
    <text style="fill: #203046; font: 13px 'Arial Unicode MS'" transform="translate(85.53 263.219371)">有已完成演示且下一实体可定位，执行到提交前</text>
   </g>
   <g id="text_6">
    <text style="fill: #203046; font: 13px 'Arial Unicode MS'" transform="translate(174.724219 322.82702)">④ 屏幕图跳步门</text>
    <text style="fill: #203046; font: 13px 'Arial Unicode MS'" transform="translate(94.195313 340.205074)">重访、可复用边、风险 / 提交守卫 / 次数限制</text>
   </g>
   <g id="text_7">
    <text style="fill: #203046; font: 13px 'Arial Unicode MS'" transform="translate(142.224219 400.681031)">⑤ 蒸馏图上下文并完成探索</text>
    <text style="fill: #203046; font: 13px 'Arial Unicode MS'" transform="translate(105.03 417.753687)">过滤、排序、探测、恢复、窗口状态检查</text>
   </g>
   <g id="text_8">
    <text style="fill: #203046; font: 13px 'Arial Unicode MS'" transform="translate(114.418438 477.851375)">⑥ 模型读取恢复后的 UI，推理并执行</text>
    <text style="fill: #203046; font: 13px 'Arial Unicode MS'" transform="translate(118.03 496.233781)">模型决定最终提交，或处理回放中断</text>
   </g>
   <g id="text_9">
    <text style="fill: #203046; font: 13px 'Arial Unicode MS'; text-anchor: middle" x="222.03" y="559.085191" transform="rotate(-0 222.03 559.085191)">⑦ 写入真实屏幕转移，准备 pending hop，提交下一代</text>
   </g>
   <g id="text_10">
    <text style="fill: #203046; font: 13px 'Arial Unicode MS'" transform="translate(564.534219 99.530645)">屏幕图 ProgressiveBeliefGraph</text>
    <text style="fill: #203046; font: 13px 'Arial Unicode MS'" transform="translate(581.707422 119.145715)">activity + 交互骨架的节点</text>
    <text style="fill: #203046; font: 13px 'Arial Unicode MS'" transform="translate(530.98 137.775324)">控件动作边，落点、恢复、代价与历史统计</text>
   </g>
   <g id="text_11">
