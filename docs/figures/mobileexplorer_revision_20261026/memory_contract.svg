<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="910" viewBox="0 0 1600 910" role="img">
<title>MobileExplorer: separate retrieval from execution acceptance</title><desc>Two UI instances share a structural page key while keeping separate contents and provenance. Transitions retain outcomes and conflicting destinations. A current UI and task are still needed to accept a retrieved behavior. This depicts the proposed logical contract, not a semantic guarantee.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#202936"/></marker>
<marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b4444"/></marker>
</defs>
<style>text {font-family: Arial, Helvetica, sans-serif; font-variant-numeric: tabular-nums;} .edge {fill:none;stroke-linecap:round;stroke-linejoin:round;}</style>
<rect width="1600" height="910" fill="white"/>
<text x="40" y="52" fill="#202936" font-size="35" font-weight="bold" text-anchor="start">
<tspan x="40" dy="0">Retrieve by structure; accept using current evidence</tspan>
</text>
<text x="40" y="102" fill="#566273" font-size="26" font-weight="normal" text-anchor="start">
<tspan x="40" dy="0">Different contents can share a page index without becoming interchangeable.</tspan>
</text>
<rect x="40" y="175" width="420" height="150" rx="12" fill="#eef4fc" stroke="#245c9c" stroke-width="2"/>
<text x="250.0" y="212" fill="#202936" font-size="29" font-weight="bold" text-anchor="middle">
<tspan x="250.0" dy="0">Observed instance A</tspan>
</text>
<text x="250.0" y="248" fill="#566273" font-size="24" font-weight="normal" text-anchor="middle">
<tspan x="250.0" dy="0">Contact editor · task A</tspan>
<tspan x="250.0" dy="31.68">Name: Alice     Phone: 101</tspan>
<tspan x="250.0" dy="31.68">source: agent</tspan>
</text>
<rect x="40" y="390" width="420" height="150" rx="12" fill="#eef4fc" stroke="#245c9c" stroke-width="2"/>
<text x="250.0" y="427" fill="#202936" font-size="29" font-weight="bold" text-anchor="middle">
<tspan x="250.0" dy="0">Observed instance B</tspan>
</text>
<text x="250.0" y="463" fill="#566273" font-size="24" font-weight="normal" text-anchor="middle">
<tspan x="250.0" dy="0">Contact editor · task B</tspan>
<tspan x="250.0" dy="31.68">Name: Bob       Phone: 202</tspan>
<tspan x="250.0" dy="31.68">source: agent</tspan>
</text>
<rect x="600" y="180" width="380" height="360" rx="12" fill="#f4f5f7" stroke="#8793a1" stroke-width="2"/>
<text x="790" y="221" fill="#202936" font-size="29" font-weight="bold" text-anchor="middle">
<tspan x="790" dy="0">Shared retrieval key</tspan>
</text>
<text x="790" y="266" fill="#202936" font-size="26" font-weight="normal" text-anchor="middle">
<tspan x="790" dy="0">package · activity</tspan>
<tspan x="790" dy="34">structural layout</tspan>
</text>
<path class="edge" d="M 625 324 L 955 324" stroke="#c7cdd4" stroke-width="1.5"/>
<text x="790" y="365" fill="#202936" font-size="27" font-weight="bold" text-anchor="middle">
<tspan x="790" dy="0">Keep instance references</tspan>
</text>
<text x="790" y="406" fill="#202936" font-size="25" font-weight="normal" text-anchor="middle">
<tspan x="790" dy="0">contents + UI attributes</tspan>
<tspan x="790" dy="34">origin + timestamp</tspan>
<tspan x="790" dy="34">interaction outcomes</tspan>
</text>
<text x="790" y="518" fill="#9b4444" font-size="20" font-weight="normal" text-anchor="middle">
<tspan x="790" dy="0">Index match ≠ execution equivalence</tspan>
</text>
<path class="edge" d="M 460 250 L 535 250 L 535 280 L 600 280" stroke="#202936" stroke-width="2.8" marker-end="url(#arrow)"/>
<path class="edge" d="M 460 465 L 535 465 L 535 440 L 600 440" stroke="#202936" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="530" y="350" fill="#566273" font-size="24" font-weight="normal" text-anchor="middle">
<tspan x="530" dy="0">index</tspan>
</text>
<rect x="1110" y="200" width="450" height="340" rx="12" fill="#f5f0fa" stroke="#80669b" stroke-width="2"/>
<text x="1335" y="241" fill="#202936" font-size="30" font-weight="bold" text-anchor="middle">
<tspan x="1335" dy="0">Execution acceptance</tspan>
</text>
<text x="1335" y="288" fill="#202936" font-size="24" font-weight="normal" text-anchor="middle">
<tspan x="1335" dy="0">Bind current task parameters</tspan>
<tspan x="1335" dy="45">Re-ground each live control</tspan>
<tspan x="1335" dy="45">Check context / observed outcome</tspan>
<tspan x="1335" dy="45">Stop on mismatch or uncertainty</tspan>
</text>
<text x="1335" y="502" fill="#566273" font-size="22" font-weight="normal" text-anchor="middle">
<tspan x="1335" dy="0">Commit decisions remain with the model</tspan>
</text>
<path class="edge" d="M 980 360 L 1110 360" stroke="#202936" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="1045" y="343" fill="#566273" font-size="23" font-weight="normal" text-anchor="middle">
<tspan x="1045" dy="0">recall</tspan>
</text>
<rect x="40" y="650" width="940" height="180" rx="12" fill="#eef8f5" stroke="#177466" stroke-width="2"/>
<text x="65" y="688" fill="#202936" font-size="27" font-weight="bold" text-anchor="start">
<tspan x="65" dy="0">Retain transition evidence and separate procedure records</tspan>
</text>
<text x="65" y="731" fill="#202936" font-size="25" font-weight="normal" text-anchor="start">
<tspan x="65" dy="0">agent: List — menu → Options; observed execution</tspan>
<tspan x="65" dy="38">explore: List — menu → Dialog; restoration rejected</tspan>
<tspan x="65" dy="38">Keep conflicting destinations; procedures come from execution.</tspan>
</text>
<path class="edge" d="M 790 650 L 790 540" stroke="#202936" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="808" y="600" fill="#566273" font-size="23" font-weight="normal" text-anchor="start">
<tspan x="808" dy="0">evidence</tspan>
</text>
<rect x="1110" y="650" width="450" height="180" rx="12" fill="#fff8e9" stroke="#b98a37" stroke-width="2"/>
<text x="1335.0" y="687" fill="#202936" font-size="29" font-weight="bold" text-anchor="middle">
<tspan x="1335.0" dy="0">Live UI + current task</tspan>
</text>
<text x="1335.0" y="723" fill="#566273" font-size="23" font-weight="normal" text-anchor="middle">
<tspan x="1335.0" dy="0">Name: Carol    Phone: 303</tspan>
<tspan x="1335.0" dy="30.360000000000003">current fields / entity / selection</tspan>
<tspan x="1335.0" dy="30.360000000000003">bind values; do not copy old contents</tspan>
</text>
<path class="edge" d="M 1335 650 L 1335 540" stroke="#202936" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="1350" y="600" fill="#566273" font-size="23" font-weight="normal" text-anchor="start">
<tspan x="1350" dy="0">check</tspan>
</text>
<text x="40" y="879" fill="#566273" font-size="23" font-weight="normal" text-anchor="start">
<tspan x="40" dy="0">Logical contract for the revision; the design note identifies checks that still require implementation changes.</tspan>
</text>
</svg>